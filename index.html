<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<title>gnomarket — coming soon</title>
<meta name="viewport" content="width=device-width, initial-scale=1" />
<meta name="description" content="gnomarket — a non-custodial NFT marketplace for gno.land. Coming soon." />
<style>
  :root {
    color-scheme: light dark;
    --bg: #0f1115;
    --text: #e7e9ee;
    --muted: #9aa3b2;
    --accent: #6ea8fe;
    --border: #2a2f3a;
  }
  @media (prefers-color-scheme: light) {
    :root { --bg: #f6f7f9; --text: #14161a; --muted: #5b6270; --accent: #2f6feb; --border: #dfe3ea; }
  }
  * { box-sizing: border-box; }
  html, body {
    height: 100%;
    margin: 0;
    background: var(--bg);
    color: var(--text);
    font: 16px/1.5 -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
  }
  body {
    display: flex;
    align-items: center;
    justify-content: center;
    padding: 1.5rem;
  }
  main { max-width: 480px; text-align: center; }
  .mark {
    font-size: 2.4rem;
    font-weight: 800;
    letter-spacing: -0.02em;
    margin: 0 0 0.75rem;
  }
  .tagline {
    color: var(--muted);
    font-size: 1.05rem;
    margin: 0 0 2rem;
  }
  .badge {
    display: inline-block;
    border: 1px solid var(--border);
    border-radius: 999px;
    padding: 0.4rem 1rem;
    font-size: 0.8rem;
    font-weight: 600;
    letter-spacing: 0.04em;
    text-transform: uppercase;
    color: var(--accent);
    margin-bottom: 2rem;
  }
  .links {
    display: flex;
    gap: 1.25rem;
    justify-content: center;
    font-size: 0.9rem;
  }
  .links a { color: var(--muted); text-decoration: none; border-bottom: 1px solid transparent; }
  .links a:hover { color: var(--text); border-bottom-color: var(--accent); }
</style>
</head>
<body>
<main>
  <div class="badge">Coming soon</div>
  <h1 class="mark">gnomarket</h1>
  <p class="tagline">A non-custodial NFT marketplace for gno.land.<br />Trade any GRC721 collection — no escrow, no custody.</p>
  <div class="links">
    <a href="https://github.com/synergycoder/market" target="_blank" rel="noopener">Source</a>
    <a href="https://gno.land" target="_blank" rel="noopener">gno.land</a>
  </div>
</main>
</body>
</html>
