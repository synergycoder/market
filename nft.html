<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<title>Gno.Market — NFT</title>
<meta name="viewport" content="width=device-width, initial-scale=1" />
<meta name="gnoconnect:rpc" content="127.0.0.1:26658" />
<meta name="gnoconnect:chainid" content="dev" />
<meta name="gnoconnect:txdomains" content="auto" />
<script src="adena-compat.js"></script>
<link rel="icon" type="image/svg+xml" href="favicon.svg" />
<link rel="stylesheet" href="style.css" />
</head>
<body>

<header>
  <h1><img src="favicon.svg" alt="" class="logo-mark" />Gno.Market<span id="chainLabel" style="display:none;"></span></h1>
  <nav class="topnav" id="appNav" style="display:none;">
    <a href="index.html">Marketplace</a>
    <a href="collections.html">Collections</a>
    <a href="nfts.html">NFTs</a>
    <a href="my-nfts.html">My NFTs</a>
  </nav>
  <div style="display:flex; align-items:center; gap:0.6rem;">
    <select id="networkSelect"></select>
    <div id="walletPillContainer"></div>
  </div>
</header>

<main>

<div id="lockedView" class="panel status" style="max-width:480px; margin:4rem auto; text-align:center;">
  This page is in private testing. <a href="index.html">Return home</a> and connect the owner's wallet.
</div>

<div id="appView" style="display:none;">
  <div class="breadcrumb">
    <a href="index.html">Marketplace</a> &rsaquo;
    <a id="collectionLink" href="#"></a> &rsaquo;
    <span id="tokenCrumb"></span>
  </div>

  <div id="loadStatus" class="status">Loading…</div>

  <div id="detail" class="detail-layout" style="display:none;">
    <div class="detail-media" id="detailMedia"></div>
    <div>
      <h1 class="detail-title" id="detailName"></h1>
      <div class="detail-collection">
        from <a id="detailCollectionLink" href="#"></a> &middot; <span id="detailTokenId"></span> &middot;
        owner <span class="mono" id="detailOwner"></span>
      </div>
      <div id="detailDesc" class="status"></div>
      <div id="detailTraits"></div>

      <div class="panel" style="margin-top:1rem;">
        <div id="tradePanel"></div>
        <p class="status" id="tradeStatus"></p>
      </div>
    </div>
  </div>
</div>

</main>

<footer class="site-footer" id="siteFooter"></footer>

<script src="shared.js?v=8"></script>
<script src="wallet.js?v=8"></script>
<script>
initNetworkSelect(document.getElementById("networkSelect"), () => { updateGnoConnectMeta(); if (unlocked) load(); });
updateGnoConnectMeta(); // initNetworkSelect only calls this on a later manual switch — a fresh load otherwise leaves the HTML's own hardcoded dev/localhost defaults in place, telling Adena the wrong network
initWalletPill(document.getElementById("walletPillContainer"));
initFooter(document.getElementById("siteFooter"));
document.addEventListener("wallet:connected", () => { if (unlocked) renderTradePanel(); });
document.addEventListener("wallet:disconnected", () => { if (unlocked) renderTradePanel(); });

const params = new URLSearchParams(location.search);
const netParam = params.get("network");
if (netParam && NETWORKS[netParam]) {
  currentNetKey = netParam;
  try { localStorage.setItem(NETWORK_STORAGE_KEY, currentNetKey); } catch { /* ignore */ }
  document.getElementById("networkSelect").value = currentNetKey;
}
const collectionID = params.get("collection") || "";
const tokenId = params.get("tid") || "";

let state = null; // { info, display, owner, listing, marketAddr, feeMode, feeValue }
let tradePanelGeneration = 0; // invalidates an in-flight approval check if renderTradePanel runs again (network/wallet switch) before it resolves

async function qevalMarket(expr) { return qevalOn(net().marketPkgPath, expr); }

async function load() {
  document.getElementById("chainLabel").textContent = net().chainId + " @ " + net().rpcUrl;
  document.getElementById("detail").style.display = "none";
  const statusEl = document.getElementById("loadStatus");
  if (!collectionID || !tokenId) {
    statusEl.textContent = "Missing collection or token ID in the URL.";
    statusEl.className = "status error";
    return;
  }
  statusEl.textContent = "Loading…";
  statusEl.className = "status";
  try {
    const tokenURI = await fetchTokenURI(collectionID, tokenId);
    const [owner] = parseGnoLines(await qevalOn(collectionID, `OwnerOf(${JSON.stringify(tokenId)})`));
    let collectionName = collectionID;
    try { collectionName = parseGnoLines(await qevalOn(collectionID, "Name()"))[0] || collectionID; } catch {}
    const display = await fetchTokenDisplayInfo(collectionID, tokenId, tokenURI || "");

    let listing = null, feeMode = null, feeValue = null;
    try { listing = await fetchListingFor(collectionID, tokenId); } catch {}
    if (net().marketplaceDeployed) {
      try { [feeMode, feeValue] = parseGnoLines(await qevalMarket("GetFee()")); } catch {}
    }
    let marketAddr = null;
    if (net().marketplaceDeployed) {
      try { [marketAddr] = parseGnoLines(await qevalMarket("MarketAddress()")); } catch {}
    }

    state = { collectionName, owner, display, listing, feeMode, feeValue, marketAddr };
    renderDetail();
    statusEl.textContent = "";
  } catch (err) {
    statusEl.textContent = "Failed to load: " + err.message;
    statusEl.className = "status error";
  }
}

function renderDetail() {
  const s = state;
  document.getElementById("detail").style.display = "grid";
  const tokenName = s.display?.name || `Token ${tokenId}`;
  document.title = `${tokenName} — Gno.Market`;
  document.getElementById("tokenCrumb").textContent = tokenName;
  document.getElementById("collectionLink").textContent = s.collectionName;
  document.getElementById("collectionLink").href = `nfts.html?collection=${encodeURIComponent(collectionID)}&network=${encodeURIComponent(currentNetKey)}`;
  document.getElementById("detailCollectionLink").textContent = s.collectionName;
  document.getElementById("detailCollectionLink").href = document.getElementById("collectionLink").href;

  document.getElementById("detailMedia").innerHTML = s.display?.image
    ? `<img src="${escapeHtml(s.display.image)}" alt="${escapeHtml(tokenName)}" />`
    : `<div class="noimg" style="display:flex;align-items:center;justify-content:center;">no image</div>`;
  document.getElementById("detailName").textContent = tokenName;
  document.getElementById("detailTokenId").textContent = "#" + tokenId;
  document.getElementById("detailOwner").textContent = s.owner || "unknown";
  document.getElementById("detailDesc").textContent = s.display?.description || "";
  document.getElementById("detailTraits").innerHTML = attributesHtml(s.display?.attributes);

  renderTradePanel();
}

function fmtGnot(ugnot) { return ugnotToGnot(ugnot) + " GNOT"; }

async function renderTradePanel() {
  if (!state) return;
  const s = state;
  const panel = document.getElementById("tradePanel");
  const me = walletAddress;

  if (!net().marketplaceDeployed) {
    panel.innerHTML = `<p class="status">Gno.Market isn't deployed on ${net().label} — buying/selling isn't available here.</p>`;
    return;
  }

  if (s.listing) {
    const fee = s.feeMode === "percent" ? Math.min(s.listing.price, Math.round(s.listing.price * s.feeValue / 10000)) : Math.min(s.listing.price, s.feeValue || 0);
    const proceeds = s.listing.price - fee;
    const isSeller = me && me === s.listing.seller;
    panel.innerHTML = `
      <div class="detail-price-box"><span class="amount">${fmtGnot(s.listing.price)}</span></div>
      <p class="status">seller ${truncAddr(s.listing.seller)} &middot; seller receives ${fmtGnot(proceeds)}, platform fee ${fmtGnot(fee)}</p>
      ${isSeller
        ? `<button id="cancelBtn" class="secondary">Cancel listing</button>`
        : `<button id="buyBtn">Buy for ${fmtGnot(s.listing.price)}</button>`}
      ${!me ? `<p class="status">Connect your wallet to ${isSeller ? "manage this listing" : "buy"}.</p>` : ""}
    `;
    if (isSeller) document.getElementById("cancelBtn")?.addEventListener("click", doCancel);
    else document.getElementById("buyBtn")?.addEventListener("click", doBuy);
    return;
  }

  const isOwner = me && s.owner && me === s.owner;
  if (!isOwner) {
    panel.innerHTML = `<p class="status">Not currently listed for sale.${!me ? " Connect your wallet — if you own this NFT, you'll be able to list it here." : ""}</p>`;
    return;
  }

  panel.innerHTML = `<p class="status">Checking approval status…</p>`;
  const renderGeneration = ++tradePanelGeneration;
  const approved = s.marketAddr ? await isApprovedForListing(collectionID, me, s.marketAddr) : false;
  if (renderGeneration !== tradePanelGeneration) return; // a newer render started (network/wallet change) — drop this stale result
  renderListForm(approved);
}

// Split into its own render so approveForListing's success handler can
// swap straight to the "List" step without re-running the approval check
// (already known true) or re-fetching token state.
function renderListForm(approved) {
  const panel = document.getElementById("tradePanel");
  if (!approved) {
    panel.innerHTML = `
      <p class="status">Not currently listed. First, approve this marketplace for your tokens in this collection:</p>
      <button id="approveBtn">Approve marketplace</button>
      <p class="status">A second step to set a price and list appears once this confirms.</p>
    `;
    document.getElementById("approveBtn").addEventListener("click", doApprove);
  } else {
    panel.innerHTML = `
      <p class="status">Approved — set a price and list:</p>
      <div class="row">
        <div class="field"><label>Price (GNOT)</label><input type="number" id="listPrice" min="0" step="0.000001" placeholder="e.g. 1.5" /></div>
        <div class="field"><button id="listBtn">List for sale</button></div>
      </div>
    `;
    document.getElementById("listBtn").addEventListener("click", doList);
    document.getElementById("listPrice").addEventListener("keydown", (e) => {
      if (e.key === "Enter") doList();
    });
  }
}

function setTradeStatus(msg, cls = "status") {
  const el = document.getElementById("tradeStatus");
  el.textContent = msg;
  el.className = cls;
}

async function doBuy() {
  setTradeStatus("Waiting for approval in Adena…");
  const res = await signAndBroadcast(net().marketPkgPath, "Buy", [collectionID, tokenId], `${state.listing.price}ugnot`);
  if (res.ok) { setTradeStatus("Purchased.", "status ok"); setTimeout(load, 1500); }
  else setTradeStatus(res.message, "status error");
}

async function doCancel() {
  setTradeStatus("Waiting for approval in Adena…");
  const res = await cancelListing(collectionID, tokenId);
  if (res.ok) { setTradeStatus("Listing cancelled.", "status ok"); setTimeout(load, 1500); }
  else setTradeStatus(res.message, "status error");
}

// Step 1 — approve, then wait for confirmation. Deliberately does NOT go
// on to create the listing itself; see approveForListing's own doc
// comment (wallet.js) for why that has to be a separate, fresh click.
async function doApprove() {
  const btn = document.getElementById("approveBtn");
  btn.disabled = true;
  if (!state.marketAddr) { setTradeStatus("Marketplace address not loaded yet.", "status error"); btn.disabled = false; return; }
  const res = await approveForListing(collectionID, state.marketAddr, (msg) => setTradeStatus(msg));
  if (!res.ok) { setTradeStatus(res.message, "status error"); btn.disabled = false; return; }
  setTradeStatus("Approved.", "status ok");
  renderListForm(true);
}

// Step 2 — a fresh click on the button renderListForm(true) revealed.
async function doList() {
  const priceGnot = parseFloat(document.getElementById("listPrice").value);
  if (!(priceGnot > 0)) { setTradeStatus("Enter a positive price first.", "status error"); return; }
  const priceUgnot = Math.round(priceGnot * 1_000_000);
  const res = await createListing(collectionID, tokenId, priceUgnot, (msg) => setTradeStatus(msg));
  if (res.ok) { setTradeStatus("Listed.", "status ok"); setTimeout(load, 1500); }
  else setTradeStatus(res.message, "status error");
}

let unlocked = false;
initGate((isOwner) => {
  unlocked = isOwner;
  document.getElementById("lockedView").style.display = isOwner ? "none" : "";
  document.getElementById("appNav").style.display = isOwner ? "" : "none";
  document.getElementById("appView").style.display = isOwner ? "" : "none";
  if (isOwner) load();
});
</script>
</body>
</html>
